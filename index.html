    <!-- Font Inter e icone: in casa (src/fonts.css, src/icons.css), nessuna richiesta a servizi esterni -->
  </head>
  <body>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #080808;
      width: 100%; height: 100%;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    #root {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #080808;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
  
    /* Campi di scrittura a 16 px sui dispositivi a tocco (più leggibili). Sul computer restano le dimensioni compatte delle tabelle del coach.
       Checkbox, selettori, file e colori non sono testo e non cambiano. */
    @media (pointer: coarse) {
      input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="color"]):not([type="button"]):not([type="submit"]):not([type="image"]),
      select, textarea { font-size: 16px !important; }
    }
  </style>
  <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
        })
      }

      // Blocca pinch zoom su iOS Safari (ignora user-scalable=no dal 2016)
      document.addEventListener('gesturestart', function(e) { e.preventDefault() })
      document.addEventListener('gesturechange', function(e) { e.preventDefault() })
      document.addEventListener('gestureend', function(e) { e.preventDefault() })

      // Blocca doppio tap zoom
      let lastTouchEnd = 0
      document.addEventListener('touchend', function(e) {
        const now = Date.now()
        if (now - lastTouchEnd <= 300) { e.preventDefault() }
        lastTouchEnd = now
      }, { passive: false })

      // Blocca pinch con touchmove a 2 dita
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) { e.preventDefault() }
      }, { passive: false })
    </script>
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(r => console.log('[FOfit] SW ok:', r.scope))
          .catch(e => console.warn('[FOfit] SW err:', e))
      })
    }
  </script>
</body>
