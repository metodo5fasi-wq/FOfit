<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FOfit</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a0800" />

    <!-- iOS Safari — questi sono i tag che fanno aprire senza barra URL -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FOfit" />

    <!-- Icone iOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Splash screen iOS (sfondo scuro mentre carica) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- SEO -->
    <meta name="description" content="FOfit — Il tuo piano alimentare personalizzato con il coach Federico Obinu" />

    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  </head>
  <body>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #0F0F0F;
      width: 100%; height: 100%;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    #root {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0F0F0F;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
  </style>
  <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
        })
      }

      // Blocca pinch zoom su iOS Safari (ignora user-scalable=no dal 2016)
      document.addEventListener('gesturestart', function(e) { e.preventDefault() })
      document.addEventListener('gesturechange', function(e) { e.preventDefault() })
      document.addEventListener('gestureend', function(e) { e.preventDefault() })

      // Blocca doppio tap zoom
      let lastTouchEnd = 0
      document.addEventListener('touchend', function(e) {
        const now = Date.now()
        if (now - lastTouchEnd <= 300) { e.preventDefault() }
        lastTouchEnd = now
      }, { passive: false })

      // Blocca pinch con touchmove a 2 dita
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) { e.preventDefault() }
      }, { passive: false })
    </script>
  </body>
</html>
